; PlatformIO project file for CI / compile verification of edf-vs-dm-rtos.
;
; This does NOT change how the firmware is flashed by hand: the Arduino IDE
; workflow in Code/README.md (copy FreeRTOSConfig.h/scheduler.h/scheduler-final.cpp
; into the Arduino_FreeRTOS_Library's src/) is still how you get this onto real
; hardware. This file exists so all four scheduling configurations can be
; cross-compiled for the real ATmega2560 target -- and the host-side tests in
; host/ can run -- from a clean checkout, without a board, e.g. in CI.
;
; src_dir/include_dir point at the existing Code/ sketch layout unchanged, so
; nothing here requires moving files around for Arduino IDE users.

[platformio]
; PlatformIO's .ino auto-discovery only looks in src_dir's own root (not
; recursively), so src_dir points straight at the sketch folder; include_dir
; stays at Code so scheduler.h/FreeRTOSConfig.h/schedPolicy.h are still found
; by #include "..." from wherever they're compiled. See
; tools/pio_overlay_freertos_config.py for how scheduler-final.cpp (which
; lives one directory up, in Code/) gets built alongside main.ino without
; being moved in the tracked tree.
src_dir = Code/main
include_dir = Code
test_dir = host/test
default_envs = rms, dms, edf_naive, edf_efficient

; Shared AVR settings. Deliberately NOT named [env] (which PlatformIO would
; auto-merge into every environment, including [env:native] below, where a
; megaatmega2560 board/arduino framework make no sense) -- each AVR env
; opts in explicitly with `extends = avr_base`.
[avr_base]
platform = atmelavr
board = megaatmega2560
framework = arduino
; Pinned to match this project's FreeRTOSConfig.h header comment
; ("FreeRTOS Kernel V10.4.3"); see root README for how this was verified.
lib_deps =
    https://github.com/feilipu/Arduino_FreeRTOS_Library.git#10.4.3-8
build_flags =
    -Wall
; The library ships its own default FreeRTOSConfig.h; this overlays ours on
; top of it (see tools/pio_overlay_freertos_config.py for why that's needed).
extra_scripts =
    pre:tools/pio_overlay_freertos_config.py

[env:rms]
extends = avr_base
build_flags =
    ${avr_base.build_flags}
    -D schedSCHEDULING_POLICY=schedSCHEDULING_POLICY_RMS

[env:dms]
extends = avr_base
build_flags =
    ${avr_base.build_flags}
    -D schedSCHEDULING_POLICY=schedSCHEDULING_POLICY_DMS

[env:edf_naive]
extends = avr_base
build_flags =
    ${avr_base.build_flags}
    -D schedSCHEDULING_POLICY=schedSCHEDULING_POLICY_EDF
    -D schedEDF_EFFICIENT=0

[env:edf_efficient]
extends = avr_base
build_flags =
    ${avr_base.build_flags}
    -D schedSCHEDULING_POLICY=schedSCHEDULING_POLICY_EDF
    -D schedEDF_EFFICIENT=1

; Representative check that the constrained-deadline task set (SCHED_TASKSET=1,
; see tasksets/constrained_deadline.json) also builds -- not in default_envs,
; since the four policy envs above are the main compile matrix; run explicitly
; with `pio run -e dms_constrained`.
[env:dms_constrained]
extends = avr_base
build_flags =
    ${avr_base.build_flags}
    -D schedSCHEDULING_POLICY=schedSCHEDULING_POLICY_DMS
    -D SCHED_TASKSET=1

; Host-native unit tests against the real scheduler-final.cpp -- see
; host/fakes/README.md for what this does and doesn't cover. Independent of
; avr_base entirely: native platform, no board, no Arduino framework.
[env:native]
platform = native
test_build_src = false
lib_deps = host/fakes
build_flags =
    -std=gnu++11
    -I host/fakes
    -I Code
    -D schedSCHEDULING_POLICY=schedSCHEDULING_POLICY_DMS
